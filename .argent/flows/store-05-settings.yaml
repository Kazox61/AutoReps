steps:
  - launch:
      ios: com.kazox.autoreps.AutoReps
      android: com.kazox.autoreps
  - echo: Home → settings tab (daily goal, EMOM, sound)
  - when:
      platform: android
    steps:
      - await:
          visible:
            text: "68"
          timeout: 20000
      - echo: Settings tab, centre measured via uiautomator on Pixel 10 Pro; "EMOM" is untranslated, so it gates the screen in every locale
      - tap:
          x: 0.5609
          y: 0.9412
      - wait: 2000
      - await:
          visible:
            text: EMOM
      - await:
          idle: true
  - when:
      platform: ios
    steps:
      - wait: 6000
      - echo: Einstellungen tab centre on iPhone 17 Pro Max
      - tap:
          x: 0.5585
          y: 0.931
      - wait: 3000
      - await:
          idle: true
