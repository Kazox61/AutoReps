executionPrerequisite: >-
  App on the populated home screen; the previous segment ended here.

steps:
  - echo: Tap the plus button into the record screen, let the ready state read, then start the workout
  - when:
      platform: android
    steps:
      - echo: Floating plus button, then the Start button, centres measured via uiautomator on Pixel 10 Pro
      - tap:
          x: 0.7391
          y: 0.9412
      - wait: 1500
      - tap:
          x: 0.5
          y: 0.9287
      - await:
          idle: true
      - wait: 3500
  - when:
      platform: ios
    steps:
      - echo: Floating plus button, centre measured on iPhone 17 Pro Max
      - tap:
          x: 0.7315
          y: 0.9305
      - wait: 1600
      - echo: Starten button, centre measured on iPhone 17 Pro Max
      - tap:
          x: 0.5
          y: 0.9185
      - wait: 4000
