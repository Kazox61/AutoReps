steps:
  - echo: Pre-grant camera now so the record screen in segment 2 never shows a permission dialog
  - when:
      platform: ios
    steps:
      - tool: settings-permissions
        args:
          action: grant
          permission: camera
          bundleId: com.kazox.autoreps.AutoReps
  - when:
      platform: android
    steps:
      - tool: settings-permissions
        args:
          action: grant
          permission: camera
          bundleId: com.kazox.autoreps
  - launch:
      ios: com.kazox.autoreps.AutoReps
      android: com.kazox.autoreps
  - echo: Home with seeded data — read it, then a slow scroll through stats and heatmap and back
  - when:
      platform: android
    steps:
      - await:
          visible:
            text: Noch 32 Wiederholungen
          timeout: 20000
      - wait: 1200
      - tool: gesture-swipe
        args:
          fromX: 0.5
          fromY: 0.72
          toX: 0.5
          toY: 0.34
          durationMs: 800
      - await:
          idle: true
      - wait: 1300
      - tool: gesture-swipe
        args:
          fromX: 0.5
          fromY: 0.4
          toX: 0.5
          toY: 0.78
          durationMs: 800
      - await:
          idle: true
      - wait: 1100
  - when:
      platform: ios
    steps:
      - wait: 3500
      - tool: gesture-swipe
        args:
          fromX: 0.5
          fromY: 0.72
          toX: 0.5
          toY: 0.34
          durationMs: 800
      - wait: 1400
      - tool: gesture-swipe
        args:
          fromX: 0.5
          fromY: 0.4
          toX: 0.5
          toY: 0.78
          durationMs: 800
      - wait: 1400
