steps:
  - launch:
      ios: com.kazox.autoreps.AutoReps
      android: com.kazox.autoreps
  - echo: Home → history tab, the five weeks of seeded sessions
  - when:
      platform: android
    steps:
      - await:
          visible:
            text: "68"
          timeout: 20000
      - echo: History tab, centre measured via uiautomator on Pixel 10 Pro
      - tap:
          x: 0.4109
          y: 0.9412
      - await:
          visible:
            text: Morgen-Session
      - await:
          idle: true
  - when:
      platform: ios
    steps:
      - wait: 6000
      - echo: Verlauf tab centre on iPhone 17 Pro Max
      - tap:
          x: 0.4135
          y: 0.931
      - wait: 1500
      - await:
          idle: true
