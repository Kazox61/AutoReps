steps:
  - echo: Home with seeded demo data. Gates on "68" (today's rep count — digits read the same in every locale); iOS waits (the flow tree cannot see Compose)
  - launch:
      ios: com.kazox.autoreps.AutoReps
      android: com.kazox.autoreps
  - when:
      platform: android
    steps:
      - await:
          visible:
            text: "68"
          timeout: 20000
      - await:
          idle: true
  - when:
      platform: ios
    steps:
      - wait: 6000
      - await:
          idle: true
